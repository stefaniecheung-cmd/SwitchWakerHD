# Copies an existing zh-appimage build artifact into a GitHub Release as an asset,
# so it shows up under "Releases -> Assets" (the artifact itself is temporary and
# lives only under the Actions run page). Run by hand from the Actions tab.
name: zh-publish-appimage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Actions run id that produced the zh-appimage artifact"
        required: true
      tag:
        description: "Release tag to attach the assets to (e.g. v1.2.1)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Download the build artifact from the given run
        run: |
          gh run download "${{ inputs.run_id }}" -R "$REPO" -n zh-appimage -D out
          echo "--- files ---"
          find out -maxdepth 2 -type f -printf '%s\t%p\n' | sort -k2

      - name: Attach AppImage and zip to the release
        run: |
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" -R "$REPO" >/dev/null
          find out -maxdepth 2 -type f \( -name '*.AppImage' -o -name '*.zip' \) -print0 \
            | while IFS= read -r -d '' f; do
                echo "uploading: $f"
                gh release upload "$TAG" "$f" -R "$REPO" --clobber
              done
          echo "--- release assets now ---"
          gh release view "$TAG" -R "$REPO" --json assets -q '.assets[] | "\(.name)\t\(.size)"'
